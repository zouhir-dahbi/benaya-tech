name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        # TODO: benayatech.com custom domain isn't live yet (DNS incomplete +
        # the repo's Settings -> Pages -> Custom domain field still needs to
        # be set, which requires admin access this token doesn't have). Until
        # then, keep building for the /veyra-security subpath that's actually
        # serving the site, or every asset path 404s. Flip SITE_URL to
        # https://benayatech.com and BASE_PATH to / once the domain is live.
        env:
          SITE_URL: https://zouhir-dahbi.github.io
          BASE_PATH: /veyra-security
          PUBLIC_FORMSPREE_ID: xeaqbrey
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
