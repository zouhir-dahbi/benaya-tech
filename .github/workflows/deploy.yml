name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        # Repo is now zouhir-dahbi/benaya-tech with benayatech.com registered
        # as its custom domain (public/CNAME + Settings -> Pages). GitHub
        # redirects the github.io URL to this domain regardless of BASE_PATH,
        # so build for the final target even while apex DNS is still
        # propagating.
        env:
          SITE_URL: https://benayatech.com
          BASE_PATH: /
          PUBLIC_FORMSPREE_ID: xeaqbrey
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
