name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        # TODO: this repo is still named "veyra-security" on GitHub — once it's
        # renamed to "benaya-tech" (see README), flip BASE_PATH/SITE_URL below
        # to match, otherwise the deployed asset paths won't line up with the
        # actual Pages URL.
        env:
          SITE_URL: https://zouhir-dahbi.github.io
          BASE_PATH: /veyra-security
          PUBLIC_FORMSPREE_ID: xeaqbrey
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
