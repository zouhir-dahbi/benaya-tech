<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Benaya Tech — Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Brand tokens mirror tailwind.config.mjs and src/data/site.ts */
  :root{
    --primary:#2563EB;
    --primary-dark:#1D4ED8;
    --primary-light:#60A5FB;
    --ink:#0F172A;
    --ink-light:#1E293B;
    --slate-600:#475569;
    --slate-400:#94A3B8;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#EEF2F7;
    display:flex;flex-wrap:wrap;
    gap:34px;justify-content:center;align-items:center;
    min-height:100vh;padding:40px;
  }

  .stack{display:flex;flex-direction:column;align-items:center}
  .label{
    font-size:10px;color:#94A3B8;letter-spacing:.18em;
    text-transform:uppercase;margin-top:10px;
  }

  .card{
    position:relative;
    width:3.5in;height:2in;
    background:#fff;border-radius:12px;overflow:hidden;
    box-shadow:0 12px 32px -8px rgba(15,23,42,.22);
    padding:0.24in 0.28in;
    display:flex;flex-direction:column;justify-content:space-between;
  }

  /* ---------- FRONT ---------- */
  .card.front::after{
    content:"";position:absolute;left:0;top:0;
    width:6px;height:100%;
    background:linear-gradient(180deg,var(--primary-light),var(--primary-dark));
  }
  .card.front::before{
    content:"";position:absolute;
    right:-0.55in;top:-0.75in;
    width:1.9in;height:1.9in;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(96,165,251,.22), rgba(37,99,235,.06) 65%, transparent 72%);
  }

  .wordmark{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    letter-spacing:-0.02em;line-height:1;color:var(--ink);
  }

  .top{position:relative;z-index:2}
  .top .wordmark{font-size:22px}
  .top .tagline{
    margin-top:5px;font-size:6.6px;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;color:var(--primary);
  }

  .person{position:relative;z-index:2}
  .person .name{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:15px;color:var(--ink);letter-spacing:-0.01em;
  }
  .person .role{
    margin-top:2px;font-size:8px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;color:var(--slate-600);
  }

  .contact{
    position:relative;z-index:2;
    display:grid;grid-template-columns:auto auto;
    gap:4px 16px;font-size:8px;color:var(--ink-light);
  }
  .contact div{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .contact svg{width:9px;height:9px;flex:0 0 9px;stroke:var(--primary);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .contact .strong{font-weight:600}

  /* ---------- BACK ---------- */
  .card.back{
    background:var(--ink);
    align-items:center;justify-content:center;text-align:center;
  }
  .card.back::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(90% 70% at 85% 0%, rgba(37,99,235,.38), transparent 60%),
      radial-gradient(70% 60% at 0% 100%, rgba(96,165,251,.18), transparent 60%);
  }
  .back-inner{position:relative;z-index:2}
  .back .wordmark{font-size:23px;color:#fff}
  .back .tagline{
    margin-top:9px;font-size:6.8px;font-weight:600;
    letter-spacing:.2em;text-transform:uppercase;color:var(--primary-light);
  }
  .rule{
    width:54px;height:2px;margin:12px auto 0;border-radius:2px;
    background:linear-gradient(90deg,var(--primary-light),var(--primary));
  }
  .back .site{
    margin-top:12px;font-size:10px;font-weight:600;
    color:#E2E8F0;letter-spacing:.06em;
  }
  .back .area{
    margin-top:5px;font-size:7px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--slate-400);
  }

  @media print{
    /* Forces Chrome to keep backgrounds/gradients instead of stripping them */
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
    @page{size:letter;margin:0.4in}
    body{background:#fff;gap:0.3in;padding:0;min-height:0;align-content:flex-start}
    .card{box-shadow:none;border:1px solid #E2E8F0;break-inside:avoid}
    .label{display:none}
  }
</style>
</head>
<body>

  <!-- FRONT -->
  <div class="stack">
    <div class="card front">
      <div class="top">
        <div class="wordmark">Benaya Tech</div>
        <div class="tagline">Smart Home &middot; Wi-Fi &middot; Security &middot; Installation</div>
      </div>

      <div class="person">
        <div class="name">Zouhir Dahbi</div>
        <div class="role">Founder &amp; Lead Technician</div>
      </div>

      <div class="contact">
        <div class="strong">
          <svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          (571) 276-5426
        </div>
        <div>
          <svg viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          info@benayatech.com
        </div>
        <div>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18 15 15 0 010-18z"/></svg>
          benayatech.com
        </div>
        <div>
          <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          Northern Virginia
        </div>
      </div>
    </div>
    <div class="label">Front</div>
  </div>

  <!-- BACK -->
  <div class="stack">
    <div class="card back">
      <div class="back-inner">
        <div class="wordmark">Benaya Tech</div>
        <div class="tagline">Design &middot; Install &middot; Configure &middot; Support</div>
        <div class="rule"></div>
        <div class="site">benayatech.com</div>
        <div class="area">Serving Northern Virginia</div>
      </div>
    </div>
    <div class="label">Back</div>
  </div>

</body>
</html>
